name: Build MACID_x86 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout MACID_x86
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git live-build debootstrap cdebootstrap curl wget

      - name: Install Kali live-build
        run: |
          wget -O /tmp/kali-keyring.deb https://http.kali.org/pool/main/k/kali-archive-keyring/kali-archive-keyring_2025.3_all.deb
          wget -O /tmp/live-build.deb https://http.kali.org/pool/main/l/live-build/live-build_20250814+kali3_all.deb
          sudo dpkg -i /tmp/kali-keyring.deb
          sudo dpkg -i /tmp/live-build.deb
          sudo dpkg --configure -a
          live-build --version

      - name: Clone Kali Live
        run: |
          git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-live.git

      - name: Configure MACID packages and branding
        run: |
          mkdir -p kali-live/kali-config/variant-xfce/package-lists
          mkdir -p kali-live/kali-config/variant-xfce/includes.binary/boot/grub/assets

          cp packages/macid.list.chroot kali-live/kali-config/variant-xfce/package-lists/macid.list.chroot

          cp boot/grub/grub.cfg kali-live/kali-config/variant-xfce/includes.binary/boot/grub/grub.cfg

          cp boot/grub/assets/4623A530-DBFC-4647-8D46-11BA56ADF2FD.png kali-live/kali-config/variant-xfce/includes.binary/boot/grub/assets/
        
          
        

      - name: Build MACID_x86
        run: |
          cd kali-live
          sudo ./build.sh --arch amd64 --variant xfce

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MACID_x86-ISO
          path: kali-live/output/*.iso
          if-no-files-found: error
